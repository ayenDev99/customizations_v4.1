<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" version="1.0" width="100%"
     height="100%"
     xmlns:xlink="http://www.w3.org/1999/xlink">

    <defs>
        <linearGradient id="myLinearGradient1"
                        x1="0%" y1="0%"
                        x2="0%" y2="100%"
                        spreadMethod="pad">
            <stop offset="0%" style="stop-color:rgb(126,186,224); stop-opacity:1"/>
            <stop offset="49%" style="stop-color:rgb(84,164,238); stop-opacity:1"/>
            <stop offset="51%" style="stop-color:rgb(54,144,240); stop-opacity:1"/>
            <stop offset="100%" style="stop-color:rgb(1,132,203); stop-opacity:1"/>
        </linearGradient>
    </defs>

    <rect width="100%" height="100%"
          style="fill:url(#myLinearGradient1);" />
</svg>
