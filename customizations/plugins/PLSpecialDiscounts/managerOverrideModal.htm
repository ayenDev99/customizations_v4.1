<div class="modal-content">
	<div class="modal-header">
		<h4 class="modal-title">Manager Override</h4>
	</div>
	<div class="modal-body">
		<div class="container-fluid">
			<div class="col-md-12">
				<div class="row">

					<div class="col-sm-12" style="margin-bottom:10px;">
						<label>Username</label>
						<input type="text" id="username" class="form-control ng-pristine ng-valid ng-isolate-scope ng-empty ng-touched" ng-model="username" placeholder="Enter manager's username">
					</div>
		
					<div class="col-sm-12">
						<label>Password</label>
						<input type="password" id="password" class="form-control ng-pristine ng-valid ng-isolate-scope ng-empty ng-touched" ng-model="password" placeholder="Enter manager's password">
					</div>
		
				</div>
			</div>
		</div>
	</div>
	<div class="modal-footer">
		<div class="container-fluid">
			<div class="row">
				<div class="col-xs-12">
					<button type="button" class="btn btn-primary" ng-click="close()">Close</button>
					<button type="button" class="btn btn-primary" ng-click="override()">Override</button>
				</div>
			</div>
		</div>
	</div>
</div>
