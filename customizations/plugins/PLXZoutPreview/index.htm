<div class="panel panel-default" id="xzout-preview-panel">
    <div class="panel-heading">
        <h4 data-translate="X/Z-out Preview">X/Z-Out Preview</h4>
    </div>
    <div class="panel-body">
        <div class="row row-container">
            <div class="col-xs-12">
                <div class="preview"></div>
            </div>
        </div>
    </div>
    <div class="panel-footer ">
        <div class="row">
            <div class="col-xs-6 text-left">
                <button class="btn btn-default" ng-click="export()">
                    <!-- <span class="glyphicon glyphicon-download-alt"></span> -->
                    <span data-translate="">Export</span>
                </button>
            </div>
            <div class="col-xs-6 text-right">
                <button class="btn btn-default" ng-click="print()">
                    <span class="glyphicon glyphicon-download-alt"></span>
                    <span data-translate="">Print</span>
                </button>
                <button class="btn btn-default" ng-click="closeModalDialog()">
                    <span class="glyphicon glyphicon-ban-circle"></span>
                    <span data-translate="">Close</span>
                </button>
            </div>
        </div>
    </div>
</div>
