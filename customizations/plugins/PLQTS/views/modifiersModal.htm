<div class="modal-content">
    <div class="modal-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-xs-12">
                    <h4 class="modal-title">Item Modifiers</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-body">
        <div class="container-fluid">
            <div class="form-group">
                <strong>Modifier 1:</strong> 
                <select ng-model="modifier1Value" class="form-control">
                    <option ng-repeat="item in modifier1Options" value="{{item}}">{{item}}</option>
                </select>
            </div>
            <div class="form-group">
                <strong>Modifier 2:</strong> 
                <select ng-model="modifier2Value" class="form-control">
                    <option ng-repeat="item in modifier2Options" value="{{item}}">{{item}}</option>
                </select>
            </div>
            <div class="form-group">
                <strong>Note:</strong> 
                <input type="text" class="form-control" ng-model="modifier3Value">
            </div>
        </div>
    </div>
    

    <div class="modal-footer">
        <div class="container-fluid">
            <div class="row">
                <div class="col-xs-12 text-right">
                    <button type="button" class="btn btn-lg btn-default" ng-click="closeModal()"><span data-translate="Close">Close</span></button>
                    <button type="button" class="btn btn-lg btn-default" ng-click="saveModifiers()"><span>Save</span></button>
                </div>
            </div>
        </div>
    </div>
</div>
