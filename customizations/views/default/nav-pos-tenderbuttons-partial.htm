    <div class="row">
        <div class="col-xs-12">
          <div class="btn-group btn-group-justified" id="rpButtons">
            <div class="btn-group">
              <button event-name="navPosTenderReturnTo" type="button" tabindex="20" id="returnToDocumentButton" class="btn btn-default" ng-click="closeTender()">
                <span class="glyphicon glyphicon-arrow-left"></span> <span data-translate="801">Back</span>
              </button>
            </div>
            <div class="btn-group">
              <button event-name="navPosTendeGiftReceipts" type="button" tabindex="22" id="giftReceiptButton" ng-disabled="document.sold_qty===0||!document.sold_qty" class="btn btn-default" ng-click="giftReceipt()">
                <span data-translate="3339">Gift Receipt</span>
              </button>
            </div>
            <div class="btn-group" ng-controller="withholdingTaxCtrl" ng-show="isWTaxEnabled">
              <button class="btn btn-default" ng-disabled="document.status===4 || !isWTaxEnabled" event-name="takeWTax" ng-click="takeWTax()" >
                <span>Withholding Tax</span>
              </button>
            </div>
            <div class="btn-group">
              <button event-name="navPosTenderPrintUpdate" type="button" tabindex="23" id="printButton" class="btn btn-default" ng-disabled="printButtonDisabled" ng-click="updateDocument(true)">
                <span data-translate="952">Print Update</span>
              </button>
            </div>
            <div class="btn-group">
              <button event-name="navPosTenderUpdateOnly" type="button" tabindex="24" id="updateButton" class="btn btn-default" data-permission="allowupdateonlyatpos" permission-disabled="updateButtonDisabled" ng-click="updateDocument(false)">
                <span data-translate="1301">Update Only</span>
              </button>
            </div>
          </div>
        </div>
    </div>
</div>
